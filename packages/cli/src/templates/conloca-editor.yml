# Written by `npx @conloca/cli editor workflow`. Builds this repository's editor files and sends them to
# Conloca. It holds no secret: GitHub vouches for this run.
name: Conloca editor
on:
  push:
    branches: ['**']
    # Conloca's own content saves skip this run, except sites.json and MDX pages, which the editor build reads.
    paths:
      - '**'
      - '!content/**'
      - 'content/**/sites.json'
      - 'content/**/*.mdx'
  workflow_dispatch:
concurrency:
  group: conloca-editor-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install conloca-editor-build --out conloca-editor-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conloca-editor-files-default
          path: conloca-editor-files
          retention-days: 1
          if-no-files-found: error
  upload:
    needs: build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conloca-editor-files-default
          path: editor-files
      - name: Send the editor files to Conloca
        env:
          CONLOCA_ENDPOINT: https://app.conloca.com
        run: |
          set -euo pipefail
          cd editor-files
          manifest_hash=$(sha256sum manifest.json | cut -d' ' -f1)
          audience="${CONLOCA_ENDPOINT%/}/editor-files/sha256:${manifest_hash}"
          card=$(curl -fsS --retry 3 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -r .value)
          echo "::add-mask::${card}"
          parts=(-F "manifest=@manifest.json;type=application/json")
          for f in files/*; do parts+=(-F "file=@${f}"); done
          curl -sS --fail-with-body --retry 4 -H 'Expect:' -H "Authorization: Bearer ${card}" "${parts[@]}" \
            "${CONLOCA_ENDPOINT%/}/api/v1/editor-uploads"
