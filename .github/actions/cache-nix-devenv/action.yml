name: Cache devenv and direnv
description: >
  The small devenv cache (.devenv/.direnv — eval SQLite, shell scripts, profile), restored and saved on every runner.
  The Nix store has its own cache in setup-devenv.

inputs:
  mode:
    description: Restore or save the Nix/devenv cache.
    required: false
    default: restore

outputs:
  cache-hit:
    description: Whether the restore step found an exact primary-key match.
    value: ${{ steps.restore-devenv.outputs.cache-hit == 'true' }}

runs:
  using: composite
  steps:
    - name: Restore devenv and direnv state
      id: restore-devenv
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v5.0.5
      with:
        path: |
          ${{ github.workspace }}/tooling/direnv/.devenv
          ${{ github.workspace }}/tooling/direnv/.direnv
        key:
          ${{ runner.os }}-${{ runner.arch }}-devenv-v3-${{ hashFiles('tooling/direnv/devenv.yaml',
          'tooling/direnv/devenv.nix', 'tooling/direnv/devenv.smoo.nix', 'tooling/direnv/devenv.lock',
          'tooling/direnv/envrc.sh', 'tooling/direnv/setup-environment.ts') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-devenv-v3-

    - name: Save devenv and direnv state
      if: inputs.mode == 'save'
      uses: actions/cache/save@v5.0.5
      with:
        path: |
          ${{ github.workspace }}/tooling/direnv/.devenv
          ${{ github.workspace }}/tooling/direnv/.direnv
        key:
          ${{ runner.os }}-${{ runner.arch }}-devenv-v3-${{ hashFiles('tooling/direnv/devenv.yaml',
          'tooling/direnv/devenv.nix', 'tooling/direnv/devenv.smoo.nix', 'tooling/direnv/devenv.lock',
          'tooling/direnv/envrc.sh', 'tooling/direnv/setup-environment.ts') }}
