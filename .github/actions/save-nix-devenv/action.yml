name: Save Nix/devenv caches
description: >
  Save the devenv/direnv eval-cache segment after the job, on every ephemeral runner where setup missed and build-shell
  produced nix-eval-cache.db. The Nix store cache saves itself in setup-devenv's post phase (ephemeral runners only).

inputs:
  devenv-cache-hit:
    description: Exact-hit output from setup-devenv's devenv cache restore.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: 🔎 Devenv save ready
      id: devenv-save
      if: inputs.devenv-cache-hit != 'true'
      shell: bash
      run: |
        db="${GITHUB_WORKSPACE}/tooling/direnv/.devenv/nix-eval-cache.db"
        if [[ -f "$db" ]]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "skip devenv save: no nix-eval-cache.db"
        fi

    - name: 🧊 Save devenv and direnv
      if: ${{ inputs.devenv-cache-hit != 'true' && steps.devenv-save.outputs.ready == 'true' }}
      uses: ./.github/actions/cache-nix-devenv
      with:
        mode: save
