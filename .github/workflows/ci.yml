name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  statuses: write

defaults:
  run:
    working-directory: tooling/direnv

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NIX_STORE_NAR: ${{ github.workspace }}/nix-store.nar
      GH_TOKEN: ${{ github.token }}
    steps:
      # Step 1: GitHub adds "Set up job" automatically
      # Step 2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          filter: tree:0
          fetch-depth: 0

      # --- Nix ----------------------------------------------------------------

      # Step 3
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
        with:
          extra-conf: |
            keep-outputs = true
            keep-derivations = true
            gc-keep-derivations = true
            gc-keep-outputs = true

      # Step 4
      # Cache Nix profiles, devenv and direnv
      - name: Cache Nix profiles, devenv and direnv
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ env.NIX_STORE_NAR }}
            ~/.nix-profile
            ~/.local/state/nix/profiles
            ~/.cache/nix
            ${{ github.workspace }}/tooling/direnv/.devenv
            ${{ github.workspace }}/tooling/direnv/.direnv
          key:
            ${{ runner.os }}-nar-${{ hashFiles('tooling/direnv/devenv.yaml', 'tooling/direnv/devenv.nix',
            'tooling/direnv/devenv.lock') }}
          restore-keys: |
            ${{ runner.os }}-nar-

      # Step 5
      - name: Restore Nix store from NAR
        run: ./github-ci.sh restore-store

      # --- devenv shell -------------------------------------------------------

      # Step 6
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: devenv

      # Step 7
      - name: Install devenv
        run: ./github-ci.sh install-devenv

      # Step 8
      - name: Cache node_modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Step 9
      - name: Build devenv shell
        run: ./github-ci.sh build-shell

      # --- Nx -----------------------------------------------------------------

      # Step 10
      # Sets the base and head SHAs required for the nx affected commands
      - uses: nrwl/nx-set-shas@15514ee4353489ef5a1644bcdae44f0ae2ea45f3 # v4.4.0
        with:
          main-branch-name: private

      - name: Normalize Nx SHAs
        run: |
          if [ -z "${NX_BASE:-}" ]; then
            echo 'NX_BASE=origin/private' >> "$GITHUB_ENV"
          fi

          if [ -z "${NX_HEAD:-}" ]; then
            echo "NX_HEAD=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      # Step 11
      - name: Cache Nx
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      # Steps 12-14 use nx-smart:
      #  - push to main  -> nx run-many (full coverage; narrow CI-only commits
      #                      cannot silently mask regressions in untouched
      #                      projects whose results are cache-green).
      #  - pull_request  -> nx affected over the full PR range (base..HEAD),
      #                      as set by nrwl/nx-set-shas above.

      # Step 12
      - name: 🔨 Build
        run: ./github-ci.sh nx-smart build "Build" 12

      # Step 13
      - name: 🔍 Lint
        run: ./github-ci.sh nx-smart lint "Lint" 13

      # Step 14
      - name: 🧪 Unit Tests
        run: ./github-ci.sh nx-smart test "Unit Tests" 14

      # --- Cleanup ------------------------------------------------------------

      - name: Cleanup and cache Nix store
        run: |
          ./github-ci.sh nix-gc
          ./github-ci.sh export-store
