name: Deploy Website

on:
  push:
    branches:
      - private
    paths:
      - 'targets/website/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment configuration
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Missing Cloudflare deploy secrets.' >&2
            exit 1
          fi

          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo 'Missing repository variable CLOUDFLARE_D1_DATABASE_ID.' >&2
            exit 1
          fi

      - name: Build workspace packages
        run: bunx nx run-many -t build --exclude=conloca-website

      - name: Build website
        working-directory: targets/website
        run: bun run build

      - name: Inject D1 database id
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os

          wrangler_path = Path('targets/website/wrangler.toml')
          content = wrangler_path.read_text()
          target = 'database_name = "conloca-website-db"\n'
          database_id = os.environ['CLOUDFLARE_D1_DATABASE_ID']

          if 'database_id =' in content:
              raise SystemExit('wrangler.toml already contains database_id')

          if target not in content:
              raise SystemExit('Could not find D1 database_name in wrangler.toml')

          content = content.replace(
              target,
              target + f'database_id = "{database_id}"\n',
          )
          wrangler_path.write_text(content)
          PY

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: targets/website
          wranglerVersion: '4.73.0'
          command: d1 migrations apply DB --remote

      - name: Deploy website worker
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: targets/website
          wranglerVersion: '4.73.0'
          command: deploy
