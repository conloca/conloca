name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description:
          Use auto for conventional commits, or force a semver bump. Prerelease publishes to next; all others publish to
          latest.
        options: [auto, patch, minor, major, prerelease]
        default: auto
      projects:
        type: string
        description:
          Comma-separated Nx projects to release, or all for every owned release package. Blank releases package-local
          changes since the last release, whatever the bump mode is.
        default: ''
      dry_run:
        type: boolean
        description: Run release commands without writing versions, tags, publishes, or GitHub Releases.
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: tooling/direnv

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LMAO_GIT_REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # --- Setup --------------------------------------------------------------

      # Step 1: GitHub adds "Set up job" automatically
      # Step 2
      - name: 📥 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # smoo publish and pending-release repair push release refs.
          persist-credentials: true

      # Step 3. Composite action internals do not affect top-level job step
      # anchors; update these comments if top-level steps move.
      - name: 🧱 Setup Nix/devenv
        id: setup
        uses: ./.github/actions/setup-devenv

      # Step 4
      - name: 🤖 Configure release author
        run:
          git config user.name "github-actions[bot]" && git config user.email
          "41898282+github-actions[bot]@users.noreply.github.com"

      # Step 5
      - name: 🧯 Repair pending releases
        run: smoo release repair-pending --dry-run "${{ inputs.dry_run }}"

      # Step 6
      - name: 🧭 Plan release
        id: plan
        env:
          SMOO_RELEASE_PROJECTS: ${{ inputs.projects }}
        run:
          smoo release version --bump "${{ inputs.bump }}" --projects "$SMOO_RELEASE_PROJECTS" --dry-run "true"
          --github-output "$GITHUB_OUTPUT"

      # --- Validation ---------------------------------------------------------

      # Release validation intentionally does not restore persisted Nx task
      # cache. Nx may reuse tasks produced earlier in this same job, but publish
      # never relies on task outputs restored from CI cache. version runs before
      # validation so the commit completed below is the commit that was checked.

      # Step 7
      - name: ✅ Check managed monorepo files (${{ steps.plan.outputs.mode }})
        if: steps.plan.outputs.mode != 'none'
        run: smoo monorepo check --warn

      # Step 8
      - name: 🔍 Lint (${{ steps.plan.outputs.mode }})
        if: steps.plan.outputs.mode != 'none'
        run: smoo github-ci nx-run-many --targets lint --projects "${{ steps.plan.outputs.projects }}"

      # Step 9
      - name: 🧪 Unit Tests (${{ steps.plan.outputs.mode }})
        if: steps.plan.outputs.mode != 'none'
        run: smoo github-ci nx-run-many --targets test --projects "${{ steps.plan.outputs.projects }}"

      # Step 10
      - name: 🔢 Version release
        id: version
        env:
          SMOO_RELEASE_PROJECTS: ${{ inputs.projects }}
        run:
          smoo release version --bump "${{ inputs.bump }}" --projects "$SMOO_RELEASE_PROJECTS" --dry-run "${{
          inputs.dry_run }}" --github-output "$GITHUB_OUTPUT"

      # Step 11
      - name: 🔨 Build (${{ steps.version.outputs.mode }})
        if: steps.version.outputs.mode != 'none'
        run:
          smoo github-ci nx-run-many --targets build --projects "${{ steps.version.outputs.projects }}" --configuration
          production

      # Step 12
      - name: 📎 Upload trace DBs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trace-results-${{ github.run_id }}
          path: packages/*/.cache/lmao/trace-results.db*
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

      # Step 13
      - name: ✅ Validate monorepo config (${{ steps.version.outputs.mode }})
        if: steps.version.outputs.mode != 'none'
        run: smoo monorepo validate --projects "${{ steps.version.outputs.projects }}" --repairs-pending

      # --- Release ------------------------------------------------------------

      # Step 14
      - name: 🏷️ Tag release
        # Ordered before the publish below so an interrupted release stays
        # detectable by the repair step at the top of this job on a later run.
        run: smoo release tag --dry-run "${{ inputs.dry_run }}"

      # Step 15
      - name: 📦 Publish release (${{ steps.version.outputs.mode }})
        # smoo packs with Bun, then publishes tarballs with npm. Existing
        # packages must already exist on npm and use trusted publishing/OIDC.
        # Missing package names are bootstrapped locally before trust setup.
        run: smoo release publish --bump "${{ inputs.bump }}" --dry-run "${{ inputs.dry_run }}"

      # --- Cleanup ------------------------------------------------------------

      # Step 16
      - name: 🧹 Cleanup and cache Nix/devenv
        # success() is default; always() still saves GH Nix cache after a red job.
        if: always()
        uses: ./.github/actions/save-nix-devenv
        with:
          devenv-cache-hit: ${{ steps.setup.outputs.devenv-cache-hit }}
