allowUnfree: true
inputs:
  # devenv's own modules, locked at a release. CI installs the devenv CLI at
  # the commit this input locks, and devenv's binary cache keeps release
  # builds for good but drops other builds after some weeks, after which
  # every fresh runner compiles the CLI from source.
  devenv:
    url: github:cachix/devenv/v2.3.1?dir=src/modules
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Leaf package source for the Go patch release matched to ttsc's vendored SDK
  # (ttsc 0.34.1 -> go1.27.3; this revision's go_1_27 is 1.27.3, the shell's Go
  # and the one that builds the typecheck tsc). An exact revision so `devenv update` cannot
  # slide Go away from the vendored SDK; it moves when the ttsc pin does.
  nixpkgs-go:
    url: github:NixOS/nixpkgs/40b7966096659ec072bc0ca0d1a102165f1509eb
    flake: true
  nixpkgs-overlay:
    url: path:../../tooling/direnv/nixpkgs-overlay
    flake: true
    overlays:
      - default
  # The Rust toolchain channel devenv.smoo.nix asks for.
  rust-overlay:
    url: github:oxalica/rust-overlay
    flake: true
    inputs:
      nixpkgs:
        follows: nixpkgs
    overlays:
      - default
  git-format-staged:
    url: github:smoothbricks/git-format-staged
    flake: true
