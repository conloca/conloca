# git-format-staged configuration for SmoothBricks-style monorepos

formatters:
  # ESLint for Astro files (run first as it only handles .astro files)
  eslint:
    command: "eslint-stdout '{}'"
    patterns:
      - '*.astro'
      - '!.*' # Exclude hidden files

  # Biome for JS/TS family (including CommonJS/CTS and ESM .mjs/.mts)
  biome:
    command: "biome check --files-ignore-unknown=true --use-editorconfig=true '--stdin-file-path={}' --fix"
    patterns:
      - '*.js'
      - '*.cjs'
      - '*.mjs'
      - '*.ts'
      - '*.cts'
      - '*.mts'
      - '*.jsx'
      - '*.tsx'
      - '*.json'
      - '*.jsonc'
      - '*.html'
      - '*.css'
      - '*.graphql'

  # Prettier for all other files (mainly Markdown)
  prettier:
    command: "prettier --ignore-unknown --stdin-filepath '{}'"
    patterns:
      # Match all files
      - '*'
      # Exclude files handled by Biome
      - '!*.js'
      - '!*.cjs'
      - '!*.mjs'
      - '!*.ts'
      - '!*.cts'
      - '!*.mts'
      - '!*.jsx'
      - '!*.tsx'
      - '!*.json'
      - '!*.jsonc'
      - '!*.html'
      - '!*.css'
      - '!*.graphql'
      # Exclude files handled by rustfmt
      - '!*.rs'
      # Exclude files handled by Alejandra
      - '!*.nix'
      # Bun lockfiles are generated and should not be rewritten by Prettier
      - '!bun.lock'
      # Cargo lockfiles are generated and should not be rewritten by Prettier
      - '!Cargo.lock'
      # Binary artifacts: not text, nothing for Prettier to do.
      - '!*.wasm'
      - '!*.wasm.sha256'
      # Prettier has no parser for these; --ignore-unknown swallows stdin and
      # emits nothing, so formatting them would truncate the file.
      - '!*.jsonl'
      - '!*.tsv'
      # Workflow templates carry __SMOO_*__ placeholders in key position and are
      # not YAML until rendered; the rendered copies are formatted on write.
      - '!packages/nx-plugin/managed/templates/github/workflows/*.yml'

  # rustfmt for Rust files
  rustfmt:
    command: 'rustfmt --edition 2024'
    patterns:
      - '*.rs'

  # Alejandra for Nix files
  alejandra:
    command: 'alejandra'
    patterns:
      - '*.nix'

settings:
  update_working_tree: true
  show_commands: true # Verbose output
