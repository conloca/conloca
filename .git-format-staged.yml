# git-format-staged configuration for SmoothBricks-style monorepos

formatters:
  # ESLint for Astro files (run first as it only handles .astro files)
  eslint:
    command: "eslint-stdout '{}'"
    patterns:
      - '*.astro'
      - '!.*' # Exclude hidden files

  # Biome for JS/TS family (including CommonJS/CTS and ESM .mjs/.mts)
  # At commit it may rewrite exactly: formatting, import order (assist/source/organizeImports) and string
  # concatenation to template literals (lint/style/useTemplate, an unsafe fix, so --unsafe with --only).
  # Those two are the land gate's autofixable refusals; every other rule stays a lint finding.
  # Biome check --write silently passes unparsable stdin through; the final biome format refuses it,
  # and the pipeline's status is that format's.
  biome-scripts:
    command:
      "biome check --write --unsafe --files-ignore-unknown=true --use-editorconfig=true
      --only=assist/source/organizeImports --only=lint/style/useTemplate '--stdin-file-path={}' | biome format
      --files-ignore-unknown=true --use-editorconfig=true '--stdin-file-path={}'"
    patterns:
      - '*.js'
      - '*.cjs'
      - '*.mjs'
      - '*.ts'
      - '*.cts'
      - '*.mts'
      - '*.jsx'
      - '*.tsx'

  # Biome for data and markup. smoo's JSON writer runs this exact command (biomeHookArguments), so a
  # file it writes is a fixed point of the hook; a test pins the two together.
  biome:
    command: "biome format --files-ignore-unknown=true --use-editorconfig=true '--stdin-file-path={}'"
    patterns:
      - '*.json'
      - '*.jsonc'
      - '*.html'
      - '*.css'
      - '*.graphql'

  # Prettier owns only file types for which its installed CLI has a parser.
  # --ignore-unknown emits empty stdout for unknown stdin, truncating files.
  prettier:
    command: "prettier --stdin-filepath '{}'"
    patterns:
      - '*.md'
      - '*.markdown'
      - '*.mdx'
      - 'README'
      - '*.yml'
      - '*.yaml'
      - '.prettierrc'
      - '.stylelintrc'
      - '.lintstagedrc'
      - '*.scss'
      - '*.less'
      - '*.pcss'
      - '*.postcss'
      - '*.vue'
      - '*.json5'
      - '*.gql'
      - '*.graphqls'
      - '*.handlebars'
      - '*.hbs'
      # Workflow templates carry __SMOO_*__ placeholders in key position and are
      # not YAML until rendered; the rendered copies are formatted on write.
      - '!packages/nx-plugin/managed/templates/github/workflows/*.yml'

  # rustfmt for Rust files
  rustfmt:
    command: 'rustfmt --edition 2024'
    patterns:
      - '*.rs'

  # gofmt for Go compiler and tooling sources
  gofmt:
    command: 'gofmt'
    patterns:
      - '*.go'

  # Alejandra for Nix files
  alejandra:
    command: 'alejandra'
    patterns:
      - '*.nix'

settings:
  update_working_tree: true
  show_commands: true # Verbose output
